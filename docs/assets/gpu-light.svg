<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<text x="40" y="48" font-size="22" font-weight="650" fill="#1f2328" text-anchor="start">The same kernel on CPU and GPU</text><text x="40" y="74" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">Milliseconds per frame for a gravity + bounce kernel (lower is better). Both axes are logarithmic. Apple M4, WebGPU via Dawn.</text><line x1="88" x2="1010" y1="403.6550888831571" y2="403.6550888831571" stroke="#eaeef2"/><text x="78" y="407.6550888831571" font-size="12" font-weight="400" fill="#818b98" text-anchor="end">0.01 ms</text><line x1="88" x2="1010" y1="291.56886110394635" y2="291.56886110394635" stroke="#eaeef2"/><text x="78" y="295.56886110394635" font-size="12" font-weight="400" fill="#818b98" text-anchor="end">0.1 ms</text><line x1="88" x2="1010" y1="179.48263332473562" y2="179.48263332473562" stroke="#eaeef2"/><text x="78" y="183.48263332473562" font-size="12" font-weight="400" fill="#818b98" text-anchor="end">1 ms</text><line x1="88" x2="88" y1="112" y2="482" stroke="#eaeef2"/><text x="88" y="504" font-size="12" font-weight="400" fill="#818b98" text-anchor="middle">1k</text><line x1="395.3333333333333" x2="395.3333333333333" y1="112" y2="482" stroke="#eaeef2"/><text x="395.3333333333333" y="504" font-size="12" font-weight="400" fill="#818b98" text-anchor="middle">10k</text><line x1="702.6666666666666" x2="702.6666666666666" y1="112" y2="482" stroke="#eaeef2"/><text x="702.6666666666666" y="504" font-size="12" font-weight="400" fill="#818b98" text-anchor="middle">100k</text><line x1="1010" x2="1010" y1="112" y2="482" stroke="#eaeef2"/><text x="1010" y="504" font-size="12" font-weight="400" fill="#818b98" text-anchor="middle">1M</text><text x="549" y="532" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">entities</text><line x1="88" x2="1010" y1="482" y2="482" stroke="#afb8c1"/><line x1="502.83314066703997" x2="502.83314066703997" y1="118" y2="482" stroke="#818b98" stroke-dasharray="4 4"/><text x="510.83314066703997" y="130" f