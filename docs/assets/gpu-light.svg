 cx="395.3" cy="303.0" r="4" fill="#1baf7a" stroke="#ffffff" stroke-width="2"/><circle cx="542.0" cy="300.6" r="4" fill="#1baf7a" stroke="#ffffff" stroke-width="2"/><circle cx="610.2" cy="296.7" r="4" fill="#1baf7a" stroke="#ffffff" stroke-width="2"/><circle cx="702.7" cy="289.2" r="4" fill="#1baf7a" stroke="#ffffff" stroke-width="2"/><circle cx="849.3" cy="243.4" r="4" fill="#1baf7a" stroke="#ffffff" stroke-width="2"/><circle cx="1010.0" cy="161.1" r="4" fill="#1baf7a" stroke="#ffffff" stroke-width="2"/><polyline points="88.0,230.0 395.3,227.9 542.0,223.4 610.2,222.9 702.7,215.7 849.3,179.0 1010.0,137.5" fill="none" stroke="#eda100" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/><circle cx="88.0" cy="230.0" r="4" fill="#eda100" stroke="#ffffff" stroke-width="2"/><circle cx="395.3" cy="227.9" r="4" fill="#eda100" stroke="#ffffff" stroke-width="2"/><circle cx="542.0" cy="223.4" r="4" fill="#eda100" stroke="#ffffff" stroke-width="2"/><circle cx="610.2" cy="222.9" r="4" fill="#eda100" stroke="#ffffff" stroke-width="2"/><circle cx="702.7" cy="215.7" r="4" fill="#eda100" stroke="#ffffff" stroke-width="2"/><circle cx="849.3" cy="179.0" r="4" fill="#eda100" stroke="#ffffff" stroke-width="2"/><circle cx="1010.0" cy="137.5" r="4" fill="#eda100" stroke="#ffffff" stroke-width="2"/><text x="1022" y="135.31332137975062" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">CPU (compiled kernel)</text><text x="1022" y="153.31332137975062" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">GPU, readback 'sync-frame'</text><text x="1022" y="171.31332137975062" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">GPU, readback 'async'</text><text x="1022" y="231.35784421146195" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">GPU, readback 'none'</text><text x="1022" y="251.35784421146195" font-size="12" font-weight="650" fill="#1f2328" text-anchor="start">0.374 vs 2.69 ms at 1M</text><text