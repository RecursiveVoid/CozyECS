<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t">
<title id="t">Milliseconds per frame for the same kernel on CPU and on GPU, from 1,000 to 1,000,000 entities</title>
