<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="446" viewBox="0 0 1200 446" role="img" aria-labelledby="t">
<title id="t">How CozyECS works: archetype tables and the kernel compilation pipeline</title>
<rect x="0.5" y="0.5" width="1199" height="445" rx="12" fill="#0d1117" stroke="#30363d"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<text x="40" y="48" font-size="19" font-weight="650" fill="#f0f6fc" text-anchor="start">Storage: one table per archetype</text><text x="40" y="72" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">Entities with the same components share a table.</text><text x="40" y="90" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">Each field is a typed-array view over one ArrayBuffer,</text><text x="40" y="108" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">so a system loops over flat, packed memory.</text><text x="40" y="140" font-size="13" font-weight="600" fill="#f0f6fc" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">Position + Velocity</text><rect x="34" y="146" width="280" height="144" rx="8" fill="#161b22" stroke="#30363d"/><text x="72" y="164" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">x</text><rect x="40" y="173" width="64" height="20" rx="3" fill="#3987e5" opacity="0.50"/><rect x="40" y="196" width="64" height="20" rx="3" fill="#3987e5" opacity="0.60"/><rect x="40" y="219" width="64" height="20" rx="3" fill="#3987e5" opacity="0.70"/><rect x="40" y="242" width="64" height="20" rx="3" fill="#3987e5" opacity="0.80"/><rect x="40" y="265" width="64" height="20" rx="3" fill="#3987e5" opacity="0.90"/><text x="140" y="164" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">y</text><rect x="108" y="173" width="64" height="20" rx="3" fill="#3987e5" opacity="0.50"/><rect x="108" y="196" width="64" height="20" rx="3" fill="#3987e5" opacity="0.60"/><rect x="108" y="219" width="64" height="20" rx="3" fill="#3987e5" opacity="0.70"/><rect x="108" y="242" width="64" height="20" rx="3" fill="#3987e5" opacity="0.80"/><rect x="108" y="265" width="64" height="20" rx="3" fill="#3987e5" opacity="0.90"/><text x="208" y="164" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">dx</text><rect x="176" y="173" width="64" height="20" rx="3" fill="#d95926" opacity="0.50"/><rect x="176" y="196" width="64" height="20" rx="3" fill="#d95926" opacity="0.60"/><rect x="176" y="219" width="64" height="20" rx="3" fill="#d95926" opacity="0.70"/><rect x="176" y="242" width="64" height="20" rx="3" fill="#d95926" opacity="0.80"/><rect x="176" y="265" width="64" height="20" rx="3" fill="#d95926" opacity="0.90"/><text x="276" y="164" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">dy</text><rect x="244" y="173" width="64" height="20" rx="3" fill="#d95926" opacity="0.50"/><rect x="244" y="196" width="64" height="20" rx="3" fill="#d95926" opacity="0.60"/><rect x="244" y="219" width="64" height="20" rx="3" fill="#d95926" opacity="0.70"/><rect x="244" y="242" width="64" height="20" rx="3" fill="#d95926" opacity="0.80"/><rect x="244" y="265" width="64" height="20" rx="3" fill="#d95926" opacity="0.90"/><text x="40" y="332" font-size="13" font-weight="600" fill="#f0f6fc" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">Position + Velocity + Player</text><rect x="34" y="338" width="348" height="98" rx="8" fill="#161b22" stroke="#30363d"/><text x="72" y="356" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">x</text><rect x="40" y="365" width="64" height="20" rx="3" fill="#3987e5" opacity="0.50"/><rect x="40" y="388" width="64" height="20" rx="3" fill="#3987e5" opacity="0.60"/><rect x="40" y="411" width="64" height="20" rx="3" fill="#3987e5" opacity="0.70"/><text x="140" y="356" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">y</text><rect x="108" y="365" width="64" height="20" rx="3" fill="#3987e5" opacity="0.50"/><rect x="108" y="388" width="64" height="20" rx="3" fill="#3987e5" opacity="0.60"/><rect x="108" y="411" width="64" height="20" rx="3" fill="#3987e5" opacity="0.70"/><text x="208" y="356" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">dx</text><rect x="176" y="365" width="64" height="20" rx="3" fill="#d95926" opacity="0.50"/><rect x="176" y="388" width="64" height="20" rx="3" fill="#d95926" opacity="0.60"/><rect x="176" y="411" width="64" height="20" rx="3" fill="#d95926" opacity="0.70"/><text x="276" y="356" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">dy</text><rect x="244" y="365" width="64" height="20" rx="3" fill="#d95926" opacity="0.50"/><rect x="244" y="388" width="64" height="20" rx="3" fill="#d95926" opacity="0.60"/><rect x="244" y="411" width="64" height="20" rx="3" fill="#d95926" opacity="0.70"/><text x="344" y="356" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">hp</text><rect x="312" y="365" width="64" height="20" rx="3" fill="#199e70" opacity="0.50"/><rect x="312" y="388" width="64" height="20" rx="3" fill="#199e70" opacity="0.60"/><rect x="312" y="411" width="64" height="20" rx="3" fill="#199e70" opacity="0.70"/><text x="470" y="48" font-size="19" font-weight="650" fill="#f0f6fc" text-anchor="start">GPU kernels: write JavaScript, run WGSL</text><text x="470" y="72" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">kernelSystem() reads your function, checks it against a small safe subset,</text><text x="470" y="90" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">and compiles it twice. auto picks the faster backend by entity count.</text><rect x="470" y="122" width="210" height="88" rx="10" fill="#161b22" stroke="#30363d"/><rect x="470" y="136" width="4" height="60" rx="2" fill="#3987e5"/><text x="488" y="149" font-size="14" font-weight="650" fill="#f0f6fc" text-anchor="start">Your kernel</text><text x="488" y="170" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">(p, v, dt, u) =&gt; {</text><text x="488" y="188" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">  p.x += v.dx * dt }</text><rect x="720" y="122" width="190" height="88" rx="10" fill="#161b22" stroke="#30363d"/><text x="738" y="149" font-size="14" font-weight="650" fill="#f0f6fc" text-anchor="start">Parser</text><text x="738" y="170" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">no dependencies</text><text x="738" y="188" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">minified code OK</text><rect x="950" y="122" width="210" height="88" rx="10" fill="#161b22" stroke="#30363d"/><text x="968" y="149" font-size="14" font-weight="650" fill="#f0f6fc" text-anchor="start">Kernel IR</text><text x="968" y="170" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">typed, validated</text><text x="968" y="188" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">clear errors w/ source</text><line x1="682" y1="166" x2="718" y2="166" stroke="#6e7681" stroke-width="1.5"/><path d="M718,166 l-7,-4 v8 z" fill="#6e7681" transform="rotate(0 718 166)"/><line x1="912" y1="166" x2="948" y2="166" stroke="#6e7681" stroke-width="1.5"/><path d="M948,166 l-7,-4 v8 z" fill="#6e7681" transform="rotate(0 948 166)"/><rect x="720" y="262" width="210" height="104" rx="10" fill="#161b22" stroke="#30363d"/><rect x="720" y="276" width="4" height="76" rx="2" fill="#d95926"/><text x="738" y="289" font-size="14" font-weight="650" fill="#f0f6fc" text-anchor="start">WGSL compute shader</text><text x="738" y="310" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">one storage buffer</text><text x="738" y="328" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">per archetype</text><text x="738" y="346" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">readback: none / async / sync</text><rect x="950" y="262" width="210" height="104" rx="10" fill="#161b22" stroke="#30363d"/><rect x="950" y="276" width="4" height="76" rx="2" fill="#199e70"/><text x="968" y="289" font-size="14" font-weight="650" fill="#f0f6fc" text-anchor="start">Compiled JS loop</text><text x="968" y="310" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">columns as constants</text><text x="968" y="328" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">CPU fallback, exact parity</text><text x="968" y="346" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">1.1-1.3× bitecs</text><line x1="1030" y1="212" x2="850" y2="258" stroke="#6e7681" stroke-width="1.5"/><path d="M850,258 l-7,-4 v8 z" fill="#6e7681" transform="rotate(165.6645645804799 850 258)"/><line x1="1055" y1="212" x2="1055" y2="258" stroke="#6e7681" stroke-width="1.5"/><path d="M1055,258 l-7,-4 v8 z" fill="#6e7681" transform="rotate(90 1055 258)"/><text x="470" y="398" font-size="12.5" font-weight="400" fill="#6e7681" text-anchor="start">target: 'auto' runs small queries on the CPU and large ones on the GPU.</text><text x="470" y="416" font-size="12.5" font-weight="400" fill="#6e7681" text-anchor="start">calibrateAuto() measures the switch point on the user’s own device.</text>
</g>
</svg>
